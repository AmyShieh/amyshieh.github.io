<html class="staticrypt-html" lang="zh-CN">
    <head>
        <meta charset="utf-8" />
        <title>私人空间</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex,nofollow" />

        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />

        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --bg-start: #f4faf2;
                --bg-end: #cde6c7;
                --card-bg: #ffffff;
                --primary: #2e8555;
                --primary-hover: #29784c;
                --text: #1f2937;
                --text-soft: #6b7280;
                --border: #dbe9d4;
                --input-bg: #f4faf2;
                --shadow-tint: rgba(46, 133, 85, 0.18);
            }

            * {
                box-sizing: border-box;
            }

            .staticrypt-html,
            .staticrypt-body {
                height: 100%;
                margin: 0;
            }

            .staticrypt-content {
                min-height: 100%;
                margin: 0;
                background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
                font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Helvetica Neue", Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                color: var(--text);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }

            .staticrypt-page {
                width: 100%;
                max-width: 400px;
            }

            .staticrypt-form {
                background: var(--card-bg);
                border-radius: 18px;
                padding: 40px 32px;
                box-shadow: 0 20px 50px -20px var(--shadow-tint),
                            0 4px 12px -2px rgba(0, 0, 0, 0.05);
                text-align: center;
            }

            .staticrypt-emoji {
                font-size: 48px;
                line-height: 1;
                margin-bottom: 12px;
            }

            .staticrypt-instructions {
                margin: 0 0 24px;
            }

            .staticrypt-title {
                font-size: 22px;
                font-weight: 600;
                margin: 0 0 8px;
                color: var(--text);
            }

            .staticrypt-instructions p {
                font-size: 14px;
                color: var(--text-soft);
                margin: 0;
                line-height: 1.5;
            }

            .staticrypt-hr {
                display: none;
            }

            .staticrypt-password-container {
                position: relative;
                background: var(--input-bg);
                border: 1px solid var(--border);
                border-radius: 10px;
                margin-bottom: 16px;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .staticrypt-password-container:focus-within {
                border-color: var(--primary);
                box-shadow: 0 0 0 3px rgba(46, 133, 85, 0.15);
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                font-size: 15px;
                outline: 0;
                padding: 14px 44px 14px 16px;
                width: 100%;
                color: var(--text);
                font-family: inherit;
            }

            .staticrypt-form input::placeholder {
                color: #b8a888;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 18px;
                width: 18px;
                opacity: 0.55;
                padding: 14px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                box-sizing: content-box;
                transition: opacity 0.2s;
            }
            .staticrypt-toggle-password-visibility:hover {
                opacity: 0.85;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 18px;
                font-size: 13px;
                color: var(--text-soft);
                cursor: pointer;
                user-select: none;
            }

            .staticrypt-remember input[type="checkbox"] {
                margin-right: 8px;
                accent-color: var(--primary);
                width: 16px;
                height: 16px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                background: var(--primary);
                width: 100%;
                border: 0;
                border-radius: 10px;
                padding: 14px;
                color: #ffffff;
                font-size: 15px;
                font-weight: 500;
                font-family: inherit;
                cursor: pointer;
                outline: 0;
                transition: background 0.2s, transform 0.1s;
                letter-spacing: 0.5px;
            }
            .staticrypt-form .staticrypt-decrypt-button:hover {
                background: var(--primary-hover);
            }
            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: scale(0.98);
            }

            .staticrypt-footer {
                margin-top: 18px;
                font-size: 12px;
                color: var(--text-soft);
                opacity: 0.7;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-decrypt-button:disabled {
                cursor: wait;
                opacity: 0.65;
            }

            .staticrypt-status {
                margin: 12px 0 0;
                font-size: 13px;
                line-height: 1.5;
                color: var(--text-soft);
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                .staticrypt-form input[type="text"] {
                    font-size: 16px;
                }
            }
        </style>

                const button = document.getElementById("staticrypt-submit");
                const status = document.getElementById("staticrypt-status");
                const password = document.getElementById("staticrypt-password");
                const remember = document.getElementById("staticrypt-remember");
                let ready = false;
                const timer = setTimeout(() => {
                    status.textContent = "加密页面还在下载。如果网络已中断，请刷新重试。";
                }, 15000);
                document.addEventListener("DOMContentLoaded", () => {
                    clearTimeout(timer);
                    if (!ready) status.textContent = "加密页面未完整加载，请刷新重试。";
                }, { once: true });

                return (decryptor, canRemember, wrongPasswordMessage) => {
                    ready = true;
                    clearTimeout(timer);
                    if (!window.crypto || !window.crypto.subtle) {
                        status.textContent = "此浏览器无法解密，请用新版浏览器通过 HTTPS 打开。";
                        return;
                    }
                    let busy = true;
                    const rememberLabel = document.getElementById("staticrypt-remember-label");
                    form.addEventListener("submit", async (event) => {
                        event.preventDefault();
                        if (busy) return;
                        busy = true;
                        button.disabled = true;
                        status.textContent = "正在解锁…";
                        try {
                            const result = await decryptor.handleDecryptionOfPage(password.value, canRemember && remember.checked);
                            if (!result.isSuccessful) status.textContent = wrongPasswordMessage;
                        } catch {
                            status.textContent = "未能解锁。请重试；如果仍然失败，请刷新页面。";
                        } finally {
                            busy = false;
                            button.disabled = false;
                        }
                    });

                    const unlockOnLoad = async () => {
                        status.textContent = "正在检查是否已记住密码…";
                        try {
                            await decryptor.handleDecryptOnLoad();
                            status.textContent = "";
                        } catch {
                            // A disabled storage API or invalid stored key must not prevent manual decryption.
                            canRemember = false;
                            status.textContent = "自动解锁不可用，请输入密码。";
                        } finally {
                            busy = false;
                            button.disabled = false;
                            if (canRemember) rememberLabel.classList.remove("hidden");
                        }
                    };
                    // Let the outer document finish parsing before StatiCrypt replaces it with document.write().
                    document.addEventListener("DOMContentLoaded", unlockOnLoad, { once: true });
                };
